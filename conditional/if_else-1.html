<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>조건문 1</title>
  </head>
  <body>
    <script>
      // if 기본구조
      // if(조건){
      // 실행 코드 <- 조건이 참이면 객체 안에 있는 것이 실행
      // }else <- 조건이 거짓이면 객체 else 객체 안에 있는 것이 실행
      let age = 25;
      if (age < 20) {
        console.log("미성년자 입니다.");
      }else{
        console.log("성인입니다.")
      }
    </script>
  </body>
</html>
