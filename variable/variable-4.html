<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 4</title>
  </head>

  <body>
    <script>
      let now = new Date();
      console.log(now);

      let display = now.toLocaleDateString();
      console.log(display);

      let displayTime = now.toLocaleTimeString();

      //화면에 나오는 결과
      document.write(`<p>오늘 날짜는 ${now}</p>`);
      document.write(`<p>오늘 날짜는 ${display}</p>`);
      document.write(`<p>현재 시간은 ${displayTime}</p>`);
      document.write(`<p>오늘 날짜는 ${display} , 현재 시간은 ${displayTime}</p>`);
    </script>
  </body>
</html>
