<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>변수 1</title>
</head>
<body>
    
    <script>
        // 변수 공부
        // 변수: 데이터를 담는 상자
        // 변수 선언과 할당
        let name = "김도원"
        console.log(name);
        // name 변수에 재할당
        name = "최강재"
        console.log(name);
        // let name = "최도원" <- 같은 변수명 사용 불가능
        console.log(name);

        const age = 30
        console.log(age);

        // age = 30 <- const는 재할당 불가능
        console.log(age);

        let userName = prompt("이름을 입력하세요","ㅇㅇㅇ")
        console.log(userName);
        document.write(`userName`);
        document.write(`<h1>이름 : ${userName}</h1>
    <p>나이 : ${age}</p>`);
    </script>
</body>
</html>
