<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>변수 2</title>
    <style>
        span{
            color: red;
        }
    </style>
  </head>
  <body>
    
    <script>
      // 변수 연산
      let x = 200;
      let y = 50;
      let total = x + y;
      console.log(total);
      //   화면에 출력할 때
      document.write(`<p>x와 y를 더한 값은 ${total} 이다</p>`);

      //   곱한 값
      let result = x * y;
      console.log(result);
      document.write(`<p>x와 y를 곱한 값은 <span>${result}</span>이다</p>`);

    </script>
  </body>
</html>
