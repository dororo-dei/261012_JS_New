<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이벤트02 - keyup 이벤트</title>
    <style>
      .box {
        width: 200px;
        height: 200px;
        background-color: papayawhip;
        margin-bottom: 20px;
      }
      .box1.active {
        background-color: palevioletred;
      }
      .box2.active {
        background-color: paleturquoise;
      }
      .box3.active {
        background-color: yellow;
      }
      .box4.active {
        background-color: orchid;
      }
    </style>
  </head>
  <body>
    <h1>keyup 이벤트</h1>
    <div class="box box1">box1</div>
    <div class="box box2">box2</div>
    <div class="box box3">box3</div>
    <div class="box box4">box4</div>
    <script>
      document.addEventListener("keyup", (e) => {
        console.log(e);
        let keyB = e.key.toLocaleLowerCase(); // 사용자가 누르는 키 이름을 소문자로
        console.log(keyB);
        let box = null; // 박스에 아무것도 없는 것을 임의로 초기화 시켜둔다
        if (keyB === "q") {
          box = document.querySelector(".box1");
        } else if (keyB === "w") {
          box = document.querySelector(".box2");
        } else if (keyB === "e") {
          box = document.querySelector(".box3");
        } else if (keyB == "r") {
          box = document.querySelector(".box4");
        }
        if (box != null) {
          box.classList.add("active");
        }
      });
    </script>
  </body>
</html>
