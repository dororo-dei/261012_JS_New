<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>증가 감소 연산자</title>
  </head>

  <body>
    <h2 class="counter">클릭횟수 : 0</h2>
    <button id="indcrease">증가(+)</button>
    <button id="decrease">감소(-)</button>

    <script>
      // 클릭 횟수를 표시할 요소 선택
      let counter = document.querySelector(".counter");
      // console.log(counter);

      // 증가 버튼 선택
      let indc = document.querySelector("#indcrease");
      // console.log(indc);

      // 감소 버튼 선택
      let dec = document.querySelector("#decrease");

      // 기본값
      let count = 0;
      // 증가 함수
      indc.addEventListener("click", function () {
        // console.log("click");
        count++;
        console.log(count);
        counter.textContent = `클릭횟수 : ${count}`;
      });
      // 감소 함수
      dec.addEventListener("click", function () {
        console.log(count);
        count--;
        counter.textContent = `클릭횟수 : ${count}`;
      });
    </script>
  </body>
</html>
