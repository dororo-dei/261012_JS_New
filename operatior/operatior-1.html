<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>연산자 1 / 이론 및 종류</title>
  </head>
  <body>
    <script>

 // 연산자: 계산하거나 비교할 때 쓰는 기호

// 1. 산술 연산자 (계산)
let a = 10;
let b = 3;

console.log(a + b); // 13 더하기
console.log(a - b); // 7 빼기
console.log(a * b); // 30 곱하기
console.log(a / b); // 3.333... 나누기

// 2. 비교 연산자 (참/거짓 확인)
console.log(5 > 3);     // true
console.log(5 < 3);     // false
console.log(5 == 3);    // false
console.log(5 === 3);   // false
console.log(5 == "5");  // true (형 변환 발생)
console.log(5 != 3);    // true (같지 않음)

// 3. 논리 연산자 (조건 연결 및 부정)
let age = 20;

console.log(age > 18 && age < 30); // true
console.log(age > 18 || age < 10); // true

// ! : 참과 거짓을 반대로
let isLogin = true;
console.log(!isLogin); // false

// 4. 증가/감소 연산자
let count = 5;

count++; // 1 증가 → 6
console.log(count); // 6

count--; // 1 감소 → 5
console.log(count); // 5

    </script>
  </body>
</html>
