<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>foreach() 01</title>
  </head>
  <body>
    <script>
      const fruits = ["사과", "바나나", "포도", "망고", "수박"];
      console.log(fruits);
      //   1. funtion 함수
      //   fruits.forEach(function(){

      //   })

      // 2. 화살표 함수
      fruits.forEach((fruits, index) => {
        // 첫번째 괄호: 현재 순회중인 배열의 요소(값)
        // 두번째 괄호: 현재 요소의 인덱스(0부터 시작)
        // 세번째 괄호: 순회중인 배열전체
        console.log(fruits);
        console.log(index); // index를 꺼내옴

        document.write(`<p>${index + 1}. ${fruits}</p>`);
      }); // (())안에 둔것이 매개변수
      //   태그 사용시엔 백틱
      //   {} 안에 있는것이 콜백함수: 다른 함수의 전달인자(Argument)로 넘겨져서 외부 함수 내부에서 호출되는 함수
    </script>
  </body>
</html>
