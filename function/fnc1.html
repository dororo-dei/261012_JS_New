<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수02 - 매개변수와 인수</title>
  </head>
  <body>
    <button style="color: red" onclick="sayHi()">클릭</button>
    <br />
    <button onclick="alert('알림창입니다!')">알림창 클릭</button>
    <br />

    <script>
      function sayHi() {
        console.log("안녕");
      }

      function greet(username, age, gu) {
        console.log("확인");
        document.write(
          `${username}님 환영합니다. 당신의 나이는 ${age}입니다.<br>`,
        );
      }

      greet("최돌수", 24, "북구");
      greet("최강재", 25, "관악구");
      greet("최비비", 26, "강서구");
    </script>
  </body>
</html>
