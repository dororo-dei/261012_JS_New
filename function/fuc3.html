<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수04 - 클릭 이벤트를 활용한 배경색 변경</title>
  </head>
  <body>
    <button id="skyBtn">하늘색</button>
    <button id="pinkBtn">분홍색</button>
    <button id="yellowBtn">노란색</button>
    <button id="blueBtn">파란색</button>
    <script>
      const skyBtn = document.querySelector("#skyBtn");
      const pinkBtn = document.querySelector("#pinkBtn");
      const yellowBtn = document.querySelector("#yellowBtn");
      const blueBtn = document.querySelector("#blueBtn");
      // 색변경 함수
      function changeColor(color) {
        document.body.style.backgroundColor = color;
      }

      skyBtn.addEventListener("click", function () {
        changeColor("skyblue");
      });
      pinkBtn.addEventListener("click", function () {
        changeColor("pink");
      });
      yellowBtn.addEventListener("click", function () {
        changeColor("yellow");
      });
      blueBtn.addEventListener("click", function () {
        changeColor("blue");
      });
    </script>
  </body>
</html>
