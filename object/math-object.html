<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math 객체</title>
  </head>
  <body>
    <script>
      let num = 2.523;

      //   ★ 가장 큰, 가장 작은 숫자
      let maxMum = Math.max(10, 5, 8, 30);
      //   console.log(maxMum);
      let minNum = Math.min(10, 5, 8, 30);
      //   console.log(minNum);

      // ★ 소수점 처리
      //   1. round() : 소수점 첫째 자리에서 반올림
      let roundNum = Math.round(num);
      console.log(roundNum);
      //   2. floor() : 소수점을 버리고 내림하여 정수로 변환
      let floorNum = Math.floor(num);
      console.log(floorNum);
      //   3. ceil() : 소수점을 올림하여 정수로 변환
      let ceilNum = Math.ceil(num);
      console.log(ceilNum); // 2.223 => 3
      //   4. random() : 0이상 1이하 그 사이의 난수 (예: 0.003435)
      let randomNum = Math.random();
      console.log(randomNum); // 새로고침 시 숫자가 계속 랜덤하게 변경된다

      //   ★ pI(원주율 값을 반환) <- 프론트엔드에서는 사용되는 일이 없다
      let PiNum = Math.PI;
      console.log(PiNum);
    </script>
  </body>
</html>
