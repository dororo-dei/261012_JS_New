<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>객체</title>
  </head>
  <body>
    <!-- 객체- 여러가지 정보를 하나로 묶어 놓은 것 -->
    <!-- 내장 객체 - 자바스크립트가 미리 만들어 놓은 객체 -->
    <!-- ※ 내장객체는 대문자로 쓸 것 -->
    <!-- Date(날짜) , Array(정보) , String(글자 수, 글자 길이) , Math(계산) -->
    <script>
      // 1. string
      const str = "Hello world";
      console.log(str);
      console.log(str.length); // length: 문자의 길이를 알 수 있는 속성
      console.log(str.toUpperCase()); // toUpperCase: 대문자로 변경하는 메서드
      //   console.log(str.toLowerCase); // toLowerCase: 소문자로 변경하는 메서드
      console.log(str.includes("world")); // incluedes: ()안에 있는 내용이 포함되어 있는지 참 거짓으로 나타내는 메서드
      // 객체는 중괄호 메서드는 소괄호
      // 속성과 메서드 구분할 것
      //   속성: ()를 해라

      //   2. Array
      const arr = [1, 2, 3, 4]; // []대괄호 안에 넣어 묶어넣는 곳을 배열이라고한다
      console.log(arr); // index번호를 0,1,2,3 순서로 표시 & 길이는 4
      console.log(arr.length);
      console.log(arr.push(5)); // : 5를 넣어라 -> 배열안에 5를 추가
      console.log(arr.join("/")); // 1/2/3/4/5 <- 이렇게 출력된다

      //   3. Date
      const today = new Date();
      console.log(today); // Date객체 안에 이 정보가 있다
      console.log(today.getDay()); // 날짜를 가져오는거라 따로 괄호안에 입력하지 않아도 된다
      // ※ getDay()는 날짜가 아니라 요일을 숫자로 반환하는 메서드
      console.log(today.getDate()); // 일을 표시 & 메서드 자체를 참조
      console.log(today.getMonth() + 1); // 현재 날짜 (월 0부터 출력하기 때문에 +1을 해야한다)
      // console.log(today.toDateString()); 우리가 보는 방식이 아님
      console.log(today.toLocaleDateString()); // 위 대신 이렇게 확인하는 것이 좋다
      console.log(today.getFullYear()); // 년도

      // 4. Math
      console.log(Math.PI); // 3.141592
      console.log(Math.max(10, 23, 100, 50)); // max()안의 가장 큰 숫자
      console.log(Math.min(10, 30, 58, 100)); // min()안의 가장 작은 숫자
      console.log(Math.random()); // 0~1 사이 난수 0과1은 포함되지 않는다

      // 5. Slice() : 시작인덱스(포함), 끝인덱스(미포함, 바로 앞까지만 자름)
      const str2 = "JavaScript";
      console.log(str2.slice(4, 10)); // 0부터 카운팅

      // 6. replace() : 문자 교체
      const sentence = "I like Java";
      console.log(sentence.replace("Java", "JavaScript"));
      // ★ 실제 문자도 변경된 것인지 혹은 consol에서 표시되는 것만 바뀌는 것인지에대한 궁금증

      // 7. split() : 문자 분리
      const data = "apple, banana, orange";
      console.log(data.split(""));
    </script>
  </body>
</html>
