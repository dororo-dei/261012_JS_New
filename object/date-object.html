<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>현재 시간</title>
  </head>
  <body>
    <p>
      현재 시각:
      <strong class="display">
        <!-- 여기에 시간이 흐르는 것을 JS로 출력 -->
      </strong>
    </p>

    <script>
      // 현재 시간을 나타내는 함수
      // 함수 선언문은 이름을 지정한다.
      function displayNow() {
        // console.log("확인"); <- 기능이 실행되고있는지 확인용
        let now = new Date();
        // console.log(now);
        const currentTime = now.toLocaleTimeString();
        console.log(currentTime); // 오전 10:52:22
        const display = document.querySelector(".display");
        // console.log(display);
        display.innerHTML = `${currentTime}`;
      }

      // 함수 호출
      //   displayNow();
      // setInterval() : 일정시간 간격으로 반복 실행하는 함수
      setInterval(displayNow, 1000); // 1000 = 1s
    </script>
  </body>
</html>
